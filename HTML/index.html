<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lavenders Cafe</title>
    <link rel="stylesheet" href="styles.css">
    <script src="site-header.js" defer></script>
    <script src="site-footer.js" defer></script>
</head>
<body>
  <!-- Custom Web Component Navigation Header -->
  <site-header></site-header>

  <!-- Main Home Content Container Housing Featured Hero Cards -->
  <div class="content">

        <!-- Hero Card 1: Iced Coffee Category Feature with Glassmorphic Overlay Button -->
        <div class="hero-card">
            <img src="images/iced hazelnut latte.png" class="hero-image img-1" alt="Iced Coffee">
            <a href="menu.html#2_" class="overlay-btn">See More</a>
        </div>

        <!-- Hero Card 2: Smoothies Category Feature with Link to Menu Section -->
        <div class="hero-card">
            <img src="images/Pineapple Smoothie.jpg" class="hero-image img-2" alt="Smoothies">
            <a href="menu.html#4_" class="overlay-btn">See More</a>
        </div>

        <!-- Hero Card 3: Tea Category Feature with Link to Menu Section -->
        <div class="hero-card">
            <img src="images/Chamomile Tea.jpg" class="hero-image img-3" alt="Tea">
            <a href="menu.html#5_" class="overlay-btn">See More</a>
        </div>

        <!-- Hero Card 4: Hot Coffee Category Feature with Link to Menu Section -->
        <div class="hero-card">
            <img src="images/americano.webp" class="hero-image img-4" alt="Coffee">
            <a href="menu.html#3_" class="overlay-btn">See More</a>
        </div>
  </div>

  <!-- Custom Web Component Footer -->
  <site-footer></site-footer>
</body>
</html>
